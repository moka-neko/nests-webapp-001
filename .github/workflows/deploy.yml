name: Deploy development

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  NODE_VERSION: "22"
  AWS_REGION: ${{ vars.DEV_AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.DEV_ECR_REPOSITORY }}
  API_BASE_URL: ${{ vars.DEV_API_BASE_URL }}
  ADMIN_S3_BUCKET: ${{ vars.DEV_ADMIN_S3_BUCKET }}
  ADMIN_CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.DEV_ADMIN_CLOUDFRONT_DISTRIBUTION_ID }}
  PUBLIC_S3_BUCKET: ${{ vars.DEV_PUBLIC_S3_BUCKET }}
  PUBLIC_CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.DEV_PUBLIC_CLOUDFRONT_DISTRIBUTION_ID }}

jobs:
  verify:
    name: Verify before deploy
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/app_test
      JWT_SECRET: ci-jwt-secret
      MFA_ENCRYPTION_KEY: ci-mfa-encryption-key
      ADMIN_EMAIL: ci-admin@example.com
      ADMIN_PASSWORD: ci-password123
      ADMIN_NAME: CI Admin
      CORS_ORIGINS: http://localhost:3001,http://localhost:5173
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3000
      VITE_API_BASE_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Build all apps
        run: npm run build:all

      - name: Run API e2e tests
        run: npm run test:e2e

  deploy-api:
    name: Deploy development API to App Runner
    runs-on: ubuntu-latest
    needs: verify
    env:
      APP_RUNNER_SERVICE_ARN: ${{ secrets.DEV_APP_RUNNER_SERVICE_ARN }}
      AWS_ROLE_TO_ASSUME: ${{ secrets.DEV_AWS_ROLE_TO_ASSUME }}
      DATABASE_URL: ${{ secrets.DEV_SUPABASE_DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DEV_SUPABASE_DIRECT_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply development migrations
        run: |
          : "${DATABASE_URL:?Set DEV_SUPABASE_DATABASE_URL repository secret}"
          : "${DIRECT_URL:?Set DEV_SUPABASE_DIRECT_URL repository secret}"
          npx prisma migrate deploy

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists
        run: |
          : "${ECR_REPOSITORY:?Set DEV_ECR_REPOSITORY repository variable}"
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" >/dev/null 2>&1 \
            || aws ecr create-repository --repository-name "$ECR_REPOSITORY" >/dev/null

      - name: Build and push API image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY"
          bash scripts/aws/docker-build-with-retry.sh \
            --tag "$IMAGE_URI:${GITHUB_SHA}" \
            --tag "$IMAGE_URI:latest" \
            .
          docker push "$IMAGE_URI:${GITHUB_SHA}"
          docker push "$IMAGE_URI:latest"

      - name: Start App Runner deployment
        run: |
          : "${APP_RUNNER_SERVICE_ARN:?Set DEV_APP_RUNNER_SERVICE_ARN repository secret}"
          OPERATION_ID=$(aws apprunner start-deployment \
            --service-arn "$APP_RUNNER_SERVICE_ARN" \
            --query OperationId \
            --output text)
          echo "Started App Runner operation ${OPERATION_ID}"
          # start-deployment は非同期。すぐ /health を叩くと旧イメージのまま成功してしまう。
          for i in $(seq 1 40); do
            OP_STATUS=$(aws apprunner list-operations \
              --service-arn "$APP_RUNNER_SERVICE_ARN" \
              --query "OperationSummaryList[?Id=='${OPERATION_ID}'].Status | [0]" \
              --output text)
            echo "App Runner operation ${OPERATION_ID}: ${OP_STATUS} (attempt ${i}/40)"
            case "$OP_STATUS" in
              SUCCEEDED)
                exit 0
                ;;
              FAILED|ROLLBACK_FAILED)
                echo "App Runner deployment failed with status ${OP_STATUS}"
                exit 1
                ;;
            esac
            sleep 15
          done
          echo "Timed out waiting for App Runner operation ${OPERATION_ID}"
          exit 1

      - name: Smoke test API
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "DEV_API_BASE_URL repository variable is not set; skipping smoke test."
            exit 0
          fi
          curl --fail --retry 10 --retry-delay 15 "$API_BASE_URL/health"
          # 管理画面の管理者一覧は GET /api/v1/admin/users に依存する。
          # 未認証なら 401。404 は旧イメージのままであることを示す。
          # App Runner 反映直後の一時的な 404 に備え、しばらくリトライする。
          for i in $(seq 1 20); do
            users_status=$(curl -sS -o /dev/null -w "%{http_code}" "$API_BASE_URL/api/v1/admin/users" || true)
            if [ "$users_status" = "401" ]; then
              echo "GET /api/v1/admin/users is available (401)"
              exit 0
            fi
            echo "waiting for GET /api/v1/admin/users (got ${users_status:-curl-error}, attempt ${i}/20)"
            sleep 15
          done
          echo "GET /api/v1/admin/users did not become available"
          exit 1

  deploy-admin:
    name: Deploy development admin to S3
    runs-on: ubuntu-latest
    needs: [verify, deploy-api]
    env:
      AWS_ROLE_TO_ASSUME: ${{ secrets.DEV_AWS_ROLE_TO_ASSUME }}
      VITE_API_BASE_URL: ${{ vars.DEV_API_BASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build admin
        run: |
          : "${VITE_API_BASE_URL:?Set DEV_API_BASE_URL repository variable}"
          npm run build:admin

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync admin assets
        run: |
          : "${ADMIN_S3_BUCKET:?Set DEV_ADMIN_S3_BUCKET repository variable}"
          aws s3 sync apps/admin/dist "s3://$ADMIN_S3_BUCKET" --delete
          if [ -n "$ADMIN_CLOUDFRONT_DISTRIBUTION_ID" ]; then
            aws cloudfront create-invalidation \
              --distribution-id "$ADMIN_CLOUDFRONT_DISTRIBUTION_ID" \
              --paths "/*"
          fi

  deploy-public:
    name: Deploy development public site to S3
    runs-on: ubuntu-latest
    needs: [verify, deploy-api]
    env:
      AWS_ROLE_TO_ASSUME: ${{ secrets.DEV_AWS_ROLE_TO_ASSUME }}
      NEXT_PUBLIC_API_BASE_URL: ${{ vars.DEV_API_BASE_URL }}
      NEXT_PUBLIC_PRIVACY_POLICY_URL: ${{ vars.DEV_NEXT_PUBLIC_PRIVACY_POLICY_URL }}
      NEXT_PUBLIC_LINE_ADD_FRIEND_URL: ${{ vars.DEV_NEXT_PUBLIC_LINE_ADD_FRIEND_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build public site
        run: |
          : "${NEXT_PUBLIC_API_BASE_URL:?Set DEV_API_BASE_URL repository variable}"
          npm run build:public

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync public assets
        run: |
          : "${PUBLIC_S3_BUCKET:?Set DEV_PUBLIC_S3_BUCKET repository variable}"
          aws s3 sync apps/public/out "s3://$PUBLIC_S3_BUCKET" --delete
          if [ -f apps/public/.s3-html-keys ]; then
            while IFS= read -r mapping; do
              [ -z "$mapping" ] && continue
              rel_html="${mapping%% *}"
              rel_key="${mapping#* }"
              aws s3 cp "apps/public/out/$rel_html" "s3://$PUBLIC_S3_BUCKET/$rel_key" \
                --content-type "text/html; charset=utf-8" \
                --cache-control "public, max-age=0, must-revalidate"
            done < apps/public/.s3-html-keys
          fi
          if [ -n "$PUBLIC_CLOUDFRONT_DISTRIBUTION_ID" ]; then
            aws cloudfront create-invalidation \
              --distribution-id "$PUBLIC_CLOUDFRONT_DISTRIBUTION_ID" \
              --paths "/*"
          fi
