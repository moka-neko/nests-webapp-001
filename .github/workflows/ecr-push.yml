name: Push API image to ECR

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag (default: commit SHA)
        required: false
        type: string
      push_latest:
        description: Also push the latest tag
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.DEV_AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.DEV_ECR_REPOSITORY }}

jobs:
  push:
    name: Build and push API image
    runs-on: ubuntu-latest
    env:
      AWS_ROLE_TO_ASSUME: ${{ secrets.DEV_AWS_ROLE_TO_ASSUME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists
        run: |
          : "${ECR_REPOSITORY:?Set DEV_ECR_REPOSITORY repository variable}"
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" >/dev/null 2>&1 \
            || aws ecr create-repository --repository-name "$ECR_REPOSITORY" >/dev/null

      - name: Build and push API image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
          PUSH_LATEST: ${{ inputs.push_latest }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY"
          docker build --tag "$IMAGE_URI:$IMAGE_TAG" .
          docker push "$IMAGE_URI:$IMAGE_TAG"
          if [ "$PUSH_LATEST" = "true" ] && [ "$IMAGE_TAG" != "latest" ]; then
            docker tag "$IMAGE_URI:$IMAGE_TAG" "$IMAGE_URI:latest"
            docker push "$IMAGE_URI:latest"
          fi
          echo "Pushed $IMAGE_URI:$IMAGE_TAG"
